name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  core:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      - name: Build core
        shell: bash
        run: |
          CGO_ENABLED=0 go build -trimpath -o dist/gospan ./cmd/gospan

  gui:
    name: GUI (Windows)
    runs-on: windows-latest
    needs: core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Setup MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc

      - name: Download GUI module deps
        working-directory: gui/fyne
        run: go mod download

      - name: Build GUI
        working-directory: gui/fyne
        env:
          CGO_ENABLED: "1"
        run: go build -trimpath -ldflags "-s -w -H=windowsgui" -o ../../dist/gospan-gui.exe .
